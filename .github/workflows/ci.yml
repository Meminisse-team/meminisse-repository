name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      GATEWAY_BACKEND: mock
      AUTOBIOGRAPHY_LLM_PROVIDER: solar
      DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements/dev.txt
      - run: pip check
      - run: python -m pytest tests -q --junitxml=/tmp/backend-tests.xml
      - name: Report failing tests
        if: failure()
        run: |
          python - <<'PYTEST'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('/tmp/backend-tests.xml')
          if report.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  for case in ET.parse(report).iter('testcase'):
                      for failure in [*case.findall('failure'), *case.findall('error')]:
                          summary.write(f"### {case.attrib.get('name')}\n\n```text\n{(failure.text or '')[-4000:]}\n```\n")
          PYTEST
  frontend:
    runs-on: ubuntu-24.04
    env:
      GATEWAY_BACKEND: mock
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/production.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r backend/requirements/production.txt
      - run: python -m scripts.export_openapi
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:types
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/generated
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
